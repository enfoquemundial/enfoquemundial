<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" type="image/svg+xml" href="../../logo/logo%20vectorizado.svg">
    <title>Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020c1a;font-family:'Segoe UI',system-ui,sans-serif}

#bg-wrap{position:fixed;inset:0;z-index:0}
#bg-wrap canvas{display:block;width:100%;height:100%}

#screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;pointer-events:none}

.card{
  pointer-events:all;
  width:420px;
  background:rgba(2,10,24,0.72);
  border:1px solid rgba(40,110,255,0.22);
  border-radius:20px;
  padding:44px 40px 38px;
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  box-shadow:
    0 0 0 1px rgba(40,110,255,0.06),
    0 32px 80px rgba(0,0,0,0.65),
    inset 0 1px 0 rgba(90,160,255,0.12),
    inset 0 -1px 0 rgba(237,50,55,0.06);
  animation:cardIn 0.7s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(28px) scale(0.97)}to{opacity:1;transform:none}}

.logo-area{
  display:flex;flex-direction:column;align-items:center;
  margin-bottom:32px;
  gap:0;
}
.logo-img{
  width:220px;height:auto;
  filter:brightness(0) invert(1);
  opacity:0.95;
  animation:fadeUp 0.6s 0.15s both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.divider-line{
  width:100%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(40,110,255,0.25),rgba(237,50,55,0.18),transparent);
  margin-top:24px;
}

.headline{
  font-size:17px;font-weight:500;
  color:rgba(190,220,255,0.9);
  letter-spacing:0.01em;
  margin:22px 0 4px;
  animation:fadeUp 0.5s 0.25s both;
}
.subline{
  font-size:13px;color:rgba(90,140,210,0.65);
  margin-bottom:28px;
  animation:fadeUp 0.5s 0.3s both;
}

.field{
  margin-bottom:16px;
  animation:fadeUp 0.5s both;
}
.field:nth-child(1){animation-delay:0.35s}
.field:nth-child(2){animation-delay:0.42s}

label{
  display:block;
  font-size:11px;font-weight:600;
  letter-spacing:0.08em;text-transform:uppercase;
  color:rgba(100,150,220,0.7);
  margin-bottom:7px;
}
.inp-wrap{position:relative}
.inp-wrap .ico{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;opacity:0.45;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
}
.inp-wrap .ico svg{width:16px;height:16px;stroke:rgba(80,160,255,1);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

input[type=email],input[type=password],input[type=text]{
  width:100%;height:46px;
  background:rgba(5,18,45,0.65);
  border:1px solid rgba(30,90,220,0.22);
  border-radius:10px;
  color:#c8dcff;
  font-size:14px;
  font-family:inherit;
  padding:0 44px 0 42px;
  outline:none;
  transition:border-color 0.2s,box-shadow 0.2s,background 0.2s;
  -webkit-appearance:none;
}
input::placeholder{color:rgba(70,120,200,0.38)}
input:focus{
  border-color:rgba(50,130,255,0.5);
  background:rgba(5,18,45,0.88);
  box-shadow:0 0 0 3px rgba(30,100,255,0.1),0 0 20px rgba(30,100,255,0.05);
}

.eye-btn{
  position:absolute;right:13px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;padding:3px;
  color:rgba(60,130,255,0.4);
  display:flex;align-items:center;
  transition:color 0.15s;
}
.eye-btn:hover{color:rgba(80,160,255,0.8)}
.eye-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.row{
  display:flex;align-items:center;justify-content:space-between;
  margin:4px 0 26px;
  animation:fadeUp 0.5s 0.48s both;
}
.chk-wrap{display:flex;align-items:center;gap:8px;cursor:pointer}
.chk-wrap input[type=checkbox]{
  width:15px;height:15px;
  accent-color:#2a7fff;cursor:pointer;
  background:rgba(5,18,45,0.7);
  border-radius:4px;
  flex-shrink:0;
}
.chk-wrap span{font-size:12px;color:rgba(100,150,210,0.7)}
.forgot{
  font-size:12px;color:rgba(60,140,255,0.7);
  text-decoration:none;
  transition:color 0.15s;
}
.forgot:hover{color:#7ab8ff}

.btn-primary{
  width:100%;height:48px;
  background:linear-gradient(135deg,#1b5fff 0%,#0d3dcc 100%);
  border:none;border-radius:10px;
  color:#ddeeff;font-size:14px;font-weight:600;
  font-family:inherit;letter-spacing:0.04em;
  cursor:pointer;position:relative;overflow:hidden;
  transition:opacity 0.15s,transform 0.1s,box-shadow 0.2s;
  box-shadow:0 6px 24px rgba(20,80,255,0.4),inset 0 1px 0 rgba(255,255,255,0.12);
  animation:fadeUp 0.5s 0.53s both;
}
.btn-primary::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.07) 0%,transparent 50%);
  border-radius:inherit;
}
.btn-primary:hover{opacity:0.9;transform:translateY(-1px);box-shadow:0 10px 32px rgba(20,80,255,0.5),inset 0 1px 0 rgba(255,255,255,0.12)}
.btn-primary:active{transform:scale(0.985)}

.sep{
  display:flex;align-items:center;gap:12px;
  margin:20px 0;
  animation:fadeUp 0.5s 0.58s both;
}
.sep::before,.sep::after{content:'';flex:1;height:1px;background:rgba(30,70,150,0.28)}
.sep span{font-size:11px;color:rgba(70,120,190,0.5);white-space:nowrap;letter-spacing:0.06em}

.btn-sso{
  width:100%;height:44px;
  background:rgba(5,18,45,0.5);
  border:1px solid rgba(30,90,220,0.2);
  border-radius:10px;
  color:rgba(130,180,255,0.75);
  font-size:13px;font-family:inherit;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:background 0.15s,border-color 0.15s;
  animation:fadeUp 0.5s 0.62s both;
}
.btn-sso:hover{background:rgba(15,40,90,0.55);border-color:rgba(50,120,255,0.35)}
.btn-sso svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:0.7}

.footer-note{
  text-align:center;margin-top:22px;
  font-size:12px;color:rgba(70,120,190,0.5);
  animation:fadeUp 0.5s 0.66s both;
}
.footer-note a{color:rgba(60,140,255,0.75);text-decoration:none;transition:color 0.15s}
.footer-note a:hover{color:#7ab8ff}

.status-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(15,50,120,0.3);
  border:1px solid rgba(30,100,200,0.2);
  border-radius:20px;padding:4px 12px;
  margin-bottom:20px;
  animation:fadeUp 0.5s 0.2s both;
}
.dot{width:6px;height:6px;border-radius:50%;background:#3a9fff;flex-shrink:0;animation:blink 2.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.status-badge span{font-size:11px;color:rgba(80,155,255,0.8);letter-spacing:0.05em}

.accent-line{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:60%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(237,50,55,0.5),rgba(30,100,255,0.5),transparent);
  border-radius:2px;
}
.card{position:relative}
</style>
</head>

// Por eso se compara un HASH (SHA-256) y no el correo/contraseña en texto plano,
// para que al menos no sean legibles directamente en el código fuente.
// Aun así, un atacante decidido podría intentar romper el hash o capturar lo que
// se escribe en el formulario. Para publicar de verdad sin este riesgo, lo ideal
// a futuro es mover el login a un servicio con backend real (o proteger /admin/
// con autenticación a nivel de hosting, ej. Cloudflare Access).
const ADMIN_EMAIL_HASH = '592d5fdb5e012b11f9b50af369cc987dc631893fcd840c2afb5a7b1782abd19a';
const ADMIN_PASS_HASH = '4d95f6eeeb8950b514a94e357f1f32caa386b9c1b6dc8f7a7c058a75334771db';

async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

document.addEventListener('DOMContentLoaded', () => {
  const btn = document.querySelector('.btn-primary');
  const errorBox = document.getElementById('login-error');
  async function doLogin() {
      const u = document.querySelector('input[type="email"]').value.trim();
      const p = document.getElementById('pwd').value;
      const [uHash, pHash] = await Promise.all([sha256(u), sha256(p)]);
      if (uHash === ADMIN_EMAIL_HASH && pHash === ADMIN_PASS_HASH) {
        errorBox.style.display = 'none';
        localStorage.setItem('enfoque_mundial_logged', 'true');
        window.location.href = '../dashboard.html';
      } else {
        errorBox.style.display = 'block';
        errorBox.style.animation = 'none';
        void errorBox.offsetWidth;
        errorBox.style.animation = 'fadeUp 0.3s both';
      }
  }
  if (btn) btn.onclick = doLogin;
  document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
});

(async()=>{
const canvas=document.getElementById('c');
const bgWrap=document.getElementById('bg-wrap');
const W=window.innerWidth;
const H=window.innerHeight;
canvas.width=W*2;canvas.height=H*2;
canvas.style.width=W+'px';canvas.style.height=H+'px';
const ctx=canvas.getContext('2d');
ctx.scale(2,2);

const proj=d3.geoNaturalEarth1().scale(W/6.1).translate([W/2,H/2]);
const path=d3.geoPath(proj,ctx);

let world;
try{const r=await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');world=await r.json();}catch(e){world=null;}

const cities=[
  {n:'New York',c:[-74,40.7]},{n:'London',c:[-0.1,51.5]},{n:'Tokyo',c:[139.7,35.7]},
  {n:'Shanghai',c:[121.5,31.2]},{n:'Singapore',c:[103.8,1.3]},{n:'Dubai',c:[55.3,25.2]},
  {n:'São Paulo',c:[-46.6,-23.5]},{n:'Lagos',c:[3.4,6.5]},{n:'Sydney',c:[151.2,-33.9]},
  {n:'Mumbai',c:[72.8,19]},{n:'Moscow',c:[37.6,55.8]},{n:'Paris',c:[2.3,48.9]},
  {n:'Frankfurt',c:[8.7,50.1]},{n:'Seoul',c:[126.9,37.6]},{n:'Chicago',c:[-87.6,41.9]},
  {n:'Los Angeles',c:[-118.2,34]},{n:'Toronto',c:[-79.4,43.7]},{n:'Cairo',c:[31.2,30]},
  {n:'Johannesburg',c:[28,-26.2]},{n:'Jakarta',c:[106.8,-6.2]},{n:'Beijing',c:[116.4,39.9]},
  {n:'Mexico City',c:[-99.1,19.4]},{n:'Buenos Aires',c:[-58.4,-34.6]},{n:'Nairobi',c:[36.8,-1.3]},
  {n:'Hong Kong',c:[114.2,22.3]},{n:'Taipei',c:[121.5,25]},{n:'Kuala Lumpur',c:[101.7,3.1]},
  {n:'Bangkok',c:[100.5,13.8]},{n:'Amsterdam',c:[4.9,52.4]},{n:'Stockholm',c:[18.1,59.3]},
  {n:'Zurich',c:[8.5,47.4]},{n:'Madrid',c:[-3.7,40.4]},{n:'Milan',c:[9.2,45.5]},
  {n:'Istanbul',c:[29,41]},{n:'Karachi',c:[67.1,24.9]},{n:'Dhaka',c:[90.4,23.8]},
  {n:'Manila',c:[120.9,14.6]},{n:'Lima',c:[-77,-12]},{n:'Bogota',c:[-74.1,4.7]},
  {n:'Santiago',c:[-70.7,-33.5]},{n:'Casablanca',c:[-7.6,33.6]},{n:'Riyadh',c:[46.7,24.7]},
  {n:'Tel Aviv',c:[34.8,32.1]},{n:'Vienna',c:[16.4,48.2]},{n:'Warsaw',c:[21,52.2]},
  {n:'Osaka',c:[135.5,34.7]},{n:'Cape Town',c:[18.4,-33.9]},{n:'Vancouver',c:[-123.1,49.3]},
  {n:'Miami',c:[-80.2,25.8]},{n:'Atlanta',c:[-84.4,33.7]}
];

const pts=cities.map(c=>{
  const p=proj(c.c);
  const isMajor=['New York','London','Tokyo','Shanghai','Singapore','Dubai','São Paulo','Sydney','Beijing','Moscow'].includes(c.n);
  const isRed=['Beijing','Moscow','Lagos','Cairo','Jakarta','Karachi'].includes(c.n);
  return{x:p[0],y:p[1],name:c.n,major:isMajor,red:isRed,pulse:Math.random()*Math.PI*2,pulseSpeed:0.02+Math.random()*0.02};
});

const extraPts=[];
for(let i=0;i<200;i++){
  const lon=(Math.random()-0.5)*340,lat=(Math.random()-0.5)*160;
  const p=proj([lon,lat]);
  if(p&&p[0]>0&&p[0]<W&&p[1]>0&&p[1]<H)
    extraPts.push({x:p[0],y:p[1],minor:true,pulse:Math.random()*Math.PI*2,pulseSpeed:0.015+Math.random()*0.025});
}
const allPts=[...pts,...extraPts];
const maxDist=W*0.17;
const connections=[];
for(let i=0;i<allPts.length;i++)
  for(let j=i+1;j<allPts.length;j++){
    const dx=allPts[i].x-allPts[j].x,dy=allPts[i].y-allPts[j].y;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<maxDist) connections.push({a:i,b:j,d,strong:!allPts[i].minor&&!allPts[j].minor});
  }

let frame=0;
function draw(){
  frame++;
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createRadialGradient(W/2,H*0.45,0,W/2,H*0.45,W*0.7);
  bg.addColorStop(0,'#071426');bg.addColorStop(0.5,'#040e1e');bg.addColorStop(1,'#020810');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(world){
    const land=topojson.feature(world,world.objects.countries);
    const borders=topojson.mesh(world,world.objects.countries,(a,b)=>a!==b);
    ctx.beginPath();path(land);ctx.fillStyle='#071d3a';ctx.fill();
    ctx.beginPath();path(land);ctx.strokeStyle='#0d3060';ctx.lineWidth=0.4;ctx.stroke();
    ctx.beginPath();path(borders);ctx.strokeStyle='#0a2448';ctx.lineWidth=0.3;ctx.stroke();
    ctx.beginPath();path({type:'Sphere'});ctx.strokeStyle='#0a1e38';ctx.lineWidth=0.5;ctx.stroke();
    const grat=d3.geoGraticule()();
    ctx.beginPath();path(grat);ctx.strokeStyle='#0a1e35';ctx.lineWidth=0.2;ctx.globalAlpha=0.4;ctx.stroke();ctx.globalAlpha=1;
  }

  const t=frame/60;
  for(const cn of connections){
    const a=allPts[cn.a],b=allPts[cn.b];
    const alpha=(1-(cn.d/maxDist));
    const baseAlpha=cn.strong?alpha*0.55:alpha*0.2;
    const anim=0.7+0.3*Math.sin(t*0.8+cn.a*0.3);
    const fa=baseAlpha*anim;
    if(fa<0.04)continue;
    const isR=(a.red||b.red);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
    ctx.strokeStyle=isR&&a.red&&b.red?`rgba(200,50,50,${fa})`:`rgba(30,120,255,${fa})`;
    ctx.lineWidth=cn.strong?0.8:0.4;ctx.stroke();
  }

  for(const p of allPts){
    p.pulse+=p.pulseSpeed;
    const pv=0.6+0.4*Math.sin(p.pulse);
    if(p.minor){
      ctx.beginPath();ctx.arc(p.x,p.y,1.5,0,Math.PI*2);ctx.fillStyle=`rgba(50,140,255,${0.4*pv})`;ctx.fill();
      ctx.beginPath();ctx.arc(p.x,p.y,0.7,0,Math.PI*2);ctx.fillStyle=`rgba(140,210,255,${0.7*pv})`;ctx.fill();
      continue;
    }
    const isRed=p.red,r=p.major?6:3.5,cr=p.major?12:7,cc=p.major?22:12;
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,cc);
    if(isRed){g.addColorStop(0,`rgba(255,80,80,${0.3*pv})`);g.addColorStop(0.5,`rgba(200,30,30,${0.15*pv})`);g.addColorStop(1,'rgba(150,0,0,0)');}
    else{g.addColorStop(0,`rgba(50,160,255,${0.35*pv})`);g.addColorStop(0.5,`rgba(20,100,255,${0.18*pv})`);g.addColorStop(1,'rgba(0,50,200,0)');}
    ctx.beginPath();ctx.arc(p.x,p.y,cc,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    if(p.major){ctx.beginPath();ctx.arc(p.x,p.y,cr,0,Math.PI*2);ctx.strokeStyle=isRed?`rgba(255,100,100,${0.25*pv})`:`rgba(60,160,255,${0.25*pv})`;ctx.lineWidth=0.8;ctx.stroke();}
    ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fillStyle=isRed?`rgba(255,120,120,${0.85*pv})`:`rgba(80,180,255,${0.85*pv})`;ctx.fill();
    ctx.beginPath();ctx.arc(p.x,p.y,r*0.45,0,Math.PI*2);ctx.fillStyle=isRed?`rgba(255,220,220,${0.95*pv})`:`rgba(210,240,255,${0.95*pv})`;ctx.fill();
  }

  const vign=ctx.createRadialGradient(W/2,H/2,H*0.2,W/2,H/2,W*0.7);
  vign.addColorStop(0,'rgba(0,0,0,0)');vign.addColorStop(0.6,'rgba(2,8,20,0.2)');vign.addColorStop(1,'rgba(2,6,16,0.8)');
  ctx.fillStyle=vign;ctx.fillRect(0,0,W,H);

  requestAnimationFrame(draw);
}
draw();
})();
</script>
