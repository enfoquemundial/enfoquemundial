name: Actualizar ID de AdSense

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-adsense-id:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Reemplazar y verificar ID anterior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = "571598" + "4507479482"
          new = "4437962050949835"
          changed = 0
          skipped = {Path(".github/workflows/migrate-adsense.yml")}

          for path in Path(".").rglob("*"):
              if (
                  not path.is_file()
                  or ".git" in path.parts
                  or path.suffix == ".pyc"
                  or path in skipped
              ):
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if old in content:
                  path.write_text(content.replace(old, new), encoding="utf-8")
                  changed += 1

          remaining = []
          for path in Path(".").rglob("*"):
              if (
                  not path.is_file()
                  or ".git" in path.parts
                  or path.suffix == ".pyc"
                  or path in skipped
              ):
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if old in content:
                  remaining.append(str(path))

          print(f"Archivos actualizados: {changed}")
          if remaining:
              raise SystemExit(f"Referencias restantes: {remaining}")
          PY

      - name: Publicar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios pendientes"
            exit 0
          fi
          git commit -m "Actualizar ID de AdSense en todo el sitio"
          git push
