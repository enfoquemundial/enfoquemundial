name: Limpiar imágenes duplicadas

on:
  push:
    paths:
      - ".github/workflows/cleanup-duplicate-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Eliminar noticias con portada repetida
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          news_path = Path("data/news.json")
          news = json.loads(news_path.read_text(encoding="utf-8"))

          def image_identity(item):
              return item["images"][0].strip().split("?", 1)[0]

          newest = {}
          for item in news:
              key = image_identity(item)
              if key not in newest or item["date"] > newest[key]["date"]:
                  newest[key] = item

          keep_ids = {item["id"] for item in newest.values()}
          removed = [item for item in news if item["id"] not in keep_ids]
          kept = [item for item in news if item["id"] in keep_ids]
          news_path.write_text(
              json.dumps(kept, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Artículos eliminados por imagen repetida: {len(removed)}")
          print(f"Artículos conservados: {len(kept)}")

          generator_path = Path("scripts/generate_site.py")
          source = generator_path.read_text(encoding="utf-8")
          if "def image_identity(url):" not in source:
              marker = '''def load_news():
              with open(NEWS_PATH, encoding="utf-8") as f:
                  return json.load(f)
          '''
              addition = '''

          def image_identity(url):
              """Identidad estable de una imagen, ignorando parámetros de recorte."""
              return (url or "").strip().split("?", 1)[0]


          def validate_unique_primary_image(entry, news, exclude_id=None):
              """Impide que dos artículos utilicen la misma imagen principal."""
              primary = image_identity((entry.get("images") or [""])[0])
              if not primary:
                  return True
              duplicate = next(
                  (
                      n for n in news
                      if n.get("id") != exclude_id
                      and image_identity((n.get("images") or [""])[0]) == primary
                  ),
                  None,
              )
              if duplicate:
                  raise ArticleValidationError(
                      f"id={entry.get('id')}: la imagen principal ya está usada por "
                      f"id={duplicate.get('id')} ('{duplicate.get('title', '')}')"
                  )
              return True
          '''
              if marker not in source:
                  raise SystemExit("No se encontró load_news para insertar la validación")
              source = source.replace(marker, marker + addition, 1)

          publish_marker = '''    validate_article(entry)
              updated_news = [entry] + news'''
          if "validate_unique_primary_image(entry, news)" not in source:
              if publish_marker not in source:
                  raise SystemExit("No se encontró publish_new")
              source = source.replace(
                  publish_marker,
                  '''    validate_article(entry)
              validate_unique_primary_image(entry, news)
              updated_news = [entry] + news''',
                  1,
              )

          edit_marker = '''    validate_article(updated_entry)  # si falla, no se escribe nada

              updated_news = [updated_entry if n["id"] == article_id else n for n in news]'''
          if "validate_unique_primary_image(updated_entry, news, exclude_id=article_id)" not in source:
              if edit_marker not in source:
                  raise SystemExit("No se encontró apply_edit")
              source = source.replace(
                  edit_marker,
                  '''    validate_article(updated_entry)  # si falla, no se escribe nada
              validate_unique_primary_image(updated_entry, news, exclude_id=article_id)

              updated_news = [updated_entry if n["id"] == article_id else n for n in news]''',
                  1,
              )

          generator_path.write_text(source, encoding="utf-8")
          PY

          rm -f             images/uploads/1778115119480_uf.png             images/uploads/1778117572400_file_0000000065bc71f88c64b0d06c770eb2.png             images/uploads/1778140691356_guerraa.png

          python3 scripts/generate_site.py
          rm -f .github/workflows/cleanup-duplicate-images.yml

      - name: Validar y publicar
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          news = json.loads(Path("data/news.json").read_text(encoding="utf-8"))
          keys = [item["images"][0].strip().split("?", 1)[0] for item in news]
          if len(keys) != len(set(keys)):
              raise SystemExit("Aún existen imágenes principales duplicadas")
          print(f"OK: {len(news)} artículos, todos con portada única")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Eliminar noticias con imágenes duplicadas"
          git push
