name: Corregir dominio SEO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-seo-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Unificar URLs con www
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = b"https://enfoquemundial.com"
          new = b"https://www.enfoquemundial.com"
          changed = 0

          def is_site_file(path):
              return (
                  path.is_file()
                  and ".git" not in path.parts
                  and not (".github" in path.parts and "workflows" in path.parts)
              )

          for path in Path(".").rglob("*"):
              if not is_site_file(path):
                  continue
              try:
                  content = path.read_bytes()
              except OSError:
                  continue
              if old in content:
                  path.write_bytes(content.replace(old, new))
                  changed += 1

          remaining = []
          for path in Path(".").rglob("*"):
              if not is_site_file(path):
                  continue
              try:
                  content = path.read_bytes()
              except OSError:
                  continue
              if old in content:
                  remaining.append(str(path))

          print(f"Archivos actualizados: {changed}")
          if remaining:
              raise SystemExit(f"Referencias restantes: {remaining}")

          joined = b"\n".join(
              p.read_bytes() for p in Path(".").rglob("*")
              if is_site_file(p)
          )
          checks = {
              "ID Analytics": b"G-JGGDQ7PN0E",
              "ID AdSense": b"4437962050949835",
              "Sitemap www": b"https://www.enfoquemundial.com/sitemap.xml",
          }
          for label, value in checks.items():
              if value not in joined:
                  raise SystemExit(f"Fallo de verificacion: {label}")
              print(f"OK: {label}")
          PY

      - name: Publicar corrección
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/**'
          if git diff --cached --quiet; then
            echo "No hay cambios pendientes"
            exit 0
          fi
          git commit -m "Unificar URLs SEO con dominio www"
          git push
